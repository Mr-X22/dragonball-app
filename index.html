<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dragon Ball Characters</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pantalla principal -->
  <div id="main-screen">
    <h1>Dragon Ball Characters</h1>
    <div id="characters" class="roster-grid"></div>
    <div id="pagination" class="pagination"></div>
  </div>

  <!-- Pantalla detalle -->
  <div id="detail-screen" style="display:none;">
    <button onclick="goBack()" class="back-btn">← Regresar</button>
    <div class="detail-container">
      <div class="left">
        <img id="detail-image" src="" alt="">
      </div>
      <div class="right">
        <!-- Nombre ahora aparece aquí -->
        <h2 id="detail-name"></h2>
        <p><strong>KI:</strong> <span id="detail-ki"></span></p>
        <p id="detail-description"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
